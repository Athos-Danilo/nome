name: Verificações do Decifra

on: [push, pull_request]

permissions:
  contents: read

jobs:
  api:
    name: Backend — Python
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.2
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: decifra_teste
          POSTGRES_PASSWORD: senha_apenas_teste
          POSTGRES_DB: decifra_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decifra_teste -d decifra_teste"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DECIFRA_MONGODB_TESTE_URL: mongodb://127.0.0.1:27017
      DECIFRA_POSTGRESQL_TESTE_URL: postgresql+psycopg://decifra_teste:senha_apenas_teste@127.0.0.1:5432/decifra_teste
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest

  interface:
    name: Frontend — React
    runs-on: ubuntu-latest
    env:
      DECIFRA_CANAL_NAVEGADOR: chromium
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run verificar-formatacao
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run testar-perfil -- --reporter=line,github
      - run: npm run testar-menu -- --reporter=line,github
      - run: npm run testar-entrada -- --reporter=line,github
      - run: npm run testar-individual -- --reporter=line,github
      - run: npm run testar-galera -- --reporter=line,github

  prova_interrupcoes:
    name: Prova — interrupções no navegador
    runs-on: ubuntu-latest
    env:
      DECIFRA_PYTHON: python
      DECIFRA_CANAL_NAVEGADOR: chromium
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: python -m pip install --require-hashes -r ../Backend/requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run testar-interrupcoes
